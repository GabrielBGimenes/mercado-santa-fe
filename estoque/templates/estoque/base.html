
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mercado Santa Fé{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body.alto-contraste {
      background-color: #000 !important;
      color: #fff !important;
    }

    .alto-contraste main,
    .alto-contraste .card,
    .alto-contraste .table,
    .alto-contraste .form-control,
    .alto-contraste .form-select,
    .alto-contraste .alert {
      background-color: #000 !important;
      color: #fff !important;
      border: 2px solid #ffeb00 !important;
    }

    .alto-contraste h1,
    .alto-contraste h2,
    .alto-contraste h3,
    .alto-contraste label,
    .alto-contraste p,
    .alto-contraste td,
    .alto-contraste th,
    .alto-contraste a {
      color: #ffeb00 !important;
    }

    .alto-contraste input::placeholder {
      color: #fff !important;
    }

    .alto-contraste .navbar {
      background-color: #000 !important;
      border-bottom: 2px solid #ffeb00;
    }

    .alto-contraste button {
      border: 2px solid #ffeb00;
    }
  </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'produto_lista' %}">
      Mercado Santa Fé
    </a>

    <div class="navbar-nav ms-auto align-items-center">
      <button
        type="button"
        id="botao-contraste"
        class="btn btn-warning btn-sm me-3"
        aria-pressed="false">
        Alto contraste
      </button>

      {% if user.is_authenticated %}
        <span class="navbar-text text-white me-3">
          {{ user.username }}
        </span>

        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="btn btn-outline-light btn-sm" type="submit">
            Sair
          </button>
        </form>
      {% endif %}
    </div>
  </div>
</nav>

<main class="container py-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}" role="status">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</main>

<script>
  const botaoContraste = document.getElementById('botao-contraste');

  function aplicarContraste(ativado) {
    document.body.classList.toggle('alto-contraste', ativado);
    botaoContraste.setAttribute('aria-pressed', ativado);
    botaoContraste.textContent = ativado
      ? 'Desativar alto contraste'
      : 'Alto contraste';
    localStorage.setItem('altoContraste', ativado);
  }

  aplicarContraste(localStorage.getItem('altoContraste') === 'true');

  botaoContraste.addEventListener('click', function () {
    const ativado = !document.body.classList.contains('alto-contraste');
    aplicarContraste(ativado);
  });
</script>

</body>
</html>
